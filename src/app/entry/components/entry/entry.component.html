<mat-tab-group>
  <mat-tab>
    <ng-template mat-tab-label>
      {{ 'users' | translate | uppercase  }}
    </ng-template>
    <app-users (user)="onUpdate($event)"
               (newUser)="createUser($event)"
               [roles]="roles$ | async"
               [users]="users$ | async"></app-users>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      {{ 'roles' | translate | uppercase  }}
    </ng-template>
    <app-roles
      [roles]="roles$ | async"
      (newRole)="createRole($event)"
      (updatedRole)="onUpdateRole($event)"
    ></app-roles>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      {{ 'permissions' | translate | uppercase  }}
    </ng-template>

    <app-permissions [permissions]="permissions$ | async"></app-permissions>
  </mat-tab>
</mat-tab-group>
