@if (show) {
  <mat-form-field appearance="fill">
    <mat-select [formControl]="control" name="" id="" multiple
      (selectionChange)="onSelectionChange($event.value)"
      >
      @for (role of roles; track role) {
        <mat-option [value]="role._id">
          {{ role.displayName }}
        </mat-option>
      }
    </mat-select>
  <!--</ng-container>-->
</mat-form-field>
}
