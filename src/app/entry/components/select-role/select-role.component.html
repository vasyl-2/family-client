<ng-container *ngIf="show">
<mat-form-field appearance="fill">
  <mat-select [formControl]="control" name="" id="" multiple
              (selectionChange)="onSelectionChange($event.value)"
  >
    <mat-option *ngFor="let role of roles" [value]="role._id">
        {{ role.displayName }}
    </mat-option>
  </mat-select>
<!--</ng-container>-->
</mat-form-field>
</ng-container>
