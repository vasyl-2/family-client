<ng-container *ngIf="show">
  <mat-form-field appearance="fill">
    <mat-select [formControl]="control" name="" id="" multiple
                (selectionChange)="onSelectionChange($event.value)"
    >
      <mat-option *ngFor="let permission of permissions" [value]="permission._id">
        {{ permission.displayName }}
      </mat-option>
    </mat-select>
    <!--</ng-container>-->
  </mat-form-field>
</ng-container>
