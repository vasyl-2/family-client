<p>

  <ng-container *ngIf="showAlert$ | async; else app">
      <div class="show-alert">
        <p>Нужно авторизироваться</p>

        <button mat-icon-button class="login" [routerLink]="['auth', 'login']">
          <mat-icon>login</mat-icon>
        </button>

      </div>

  </ng-container>

  <ng-template #app>
    <mat-toolbar color="primary">
      <button mat-icon-button class="mobile">
        <mat-icon>menu</mat-icon>
      </button>
      <span>: - )</span>
      <span class="example-spacer"></span>
      <button routerLink="/entry" mat-button class="add-photo">панель управления</button>
      <span class="example-spacer"></span>
      <button (click)="addPhoto()" mat-button class="add-photo">
        добавить фото в галлерею
      </button>

      <span class="example-spacer"></span>
      <button (click)="addVideo()" mat-button class="add-photo">
        добавить видео в галлерею
      </button>

      <span class="example-spacer"></span>
      <button (click)="addChapter()" mat-button class="add-photo">
        добавить раздел в фото-галлерею
      </button>
      <span class="example-spacer"></span>
      <button (click)="addChapter('video')" mat-button class="add-photo">
        добавить раздел в видео-галлерею
      </button>
      <span class="example-spacer"></span>

      <button routerLink="/gallery" mat-button class="add-photo">
        галлерея
      </button>
      <span class="example-spacer"></span>
      <button routerLink="/video" mat-button class="add-photo">
        видео галлерея
      </button>

      <ng-container *ngIf="!(isAuthenticated$ | async)">
        <button mat-icon-button class="login" [routerLink]="['/auth', 'login']">
          <mat-icon>login</mat-icon>
        </button>
      </ng-container>

      <ng-container *ngIf="isAuthenticated$ | async">
        <button mat-icon-button class="login" (click)="logout()">
          <mat-icon>logout</mat-icon>
        </button>
      </ng-container>


    </mat-toolbar>
  </ng-template>
</p>
