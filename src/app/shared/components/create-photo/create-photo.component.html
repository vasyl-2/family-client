<ng-container [formGroup]="addPhotoForm" >
  <div class="add-photo-wrapper">
    <mat-form-field appearance="fill">
      <mat-label>Назва</mat-label>
      <input formControlName="name" matInput>
      @if (addPhotoForm.get('name')?.hasError('required')) {
        <mat-error>назву обов'язково вказати</mat-error>
      }
    </mat-form-field>

    <mat-form-field class='description' appearance="fill">
      <mat-label>краткий опис</mat-label>
      <textarea  formControlName="description"
        matInput
        cdkTextareaAutosize
        #autosize="cdkTextareaAutosize"
        cdkAutosizeMinRows="1"
        cdkAutosizeMaxRows="5"
      ></textarea>
    </mat-form-field>

    <mat-form-field class='description' appearance="fill">
      <mat-label>{{ 'date_of_photo' | translate }}</mat-label>
      <input
        formControlName="dateOfPhoto"
        [max]="today"
        matInput
        [matDatepicker]="picker"
        />
        <mat-hint>MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>


      <div>
        <app-tree-chapters
          [chapters]="photoChapters$ | async"
        formControlName="chapter"></app-tree-chapters>
      </div>

      <div class="description">
        <label class="file">
          <mat-icon>attach_file</mat-icon>
          <span>вибери файл з диска</span>
          <input #upload class='file' id="upload-photo" type="file"  accept="image/*, application/pdf" (change)="uploadPhoto($event)">
        </label>

        <button mat-icon-button
          [color]="'default'"
          (click)="upload.click()">
          <mat-icon [ngClass]="'material-icons-outlined'">file_upload</mat-icon>
        </button>
        <span>вибери файл</span>
      </div>

    </div>



    <div class="actions">
      <p class="description">Чтобы активизировать кнопку, заполни все обязательные поля *</p>
      <button mat-button color="primary" (click)="addPhoto()" [disabled]="addPhotoForm.invalid">
        Добавить фото
      </button>
    </div>

  </ng-container>

  <button mat-button color="primary" (click)="cancel()">
    Закрыть
  </button>
