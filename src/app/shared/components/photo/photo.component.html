<div class="content">
      <img class="img" (load)="onLoad()" [src]="image" alt="image"/>
      <div class="description" *ngIf="photo$ | async as ph">
        <span class="desc">
          {{ ph.description }}
        </span>
        <div class="date">
          {{ (ph.date || '') | date: 'yyyy-MM-dd' }}
        </div>
      </div>

      <div class="edit">
        <button (click)="edit($event)" mat-button color="primary">
          Редагувати
        </button>
      </div>
      <div class="date">

      </div>
</div>
