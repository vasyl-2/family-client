<div class="content">
  <img class="img" (load)="onLoad()" [src]="image" alt="image"/>
      <div class="description" *ngIf="photo$ | async as ph">
        <span class="desc">
          {{ ph.description }}
        </span>
      </div>
      <div class="edit">
        <button (click)="edit()" mat-button color="primary">
          Редактировать
        </button>
      </div>
</div>
