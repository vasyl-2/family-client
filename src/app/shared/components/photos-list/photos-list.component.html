<ng-container *ngIf="showSideBar$ | async as showSideBar">
  <button mat-button color="primary" (click)="toggleSideBar(showSideBar)">{{ showSideBar }}</button>
</ng-container>
<div class="container" [class.open]="(open$ | async) === true">

  <div class="side-bar">
    <ng-container  [formGroup]="selectChapter">
      <app-tree-chapters formControlName="chapter" [chapters]="allChapters$ | async"></app-tree-chapters>
    </ng-container>
  </div>

  <div class="content">
<!--    <div>-->
<!--      <app-search [formControl]="search"></app-search>-->
<!--    </div>-->
    <ng-container *ngIf="subChapter$ | async as subChapter">
<!--      <div class="header"><h2>{{ subChapter.nameForUI }}</h2><button (click)="goBack(subChapter.parent)" mat-button color="primary">назад</button></div>-->
      <div class="header"><h2>{{ subChapter.nameForUI }}</h2></div>

      <ng-container *ngIf="subChapter.parent">
        <button mat-button color="primary" (click)="goBack(subChapter.parent)">{{ 'return_to_chapter' | translate }} {{ subChapter.parentTitle }}</button>
      </ng-container>

      <app-view-settings
        (view)="onViewChanged($event)"
        (order)="onOrderChanged($event)"></app-view-settings>

<!--  if subChapters are    -->
      <ng-container *ngIf="subChapter.children">
        <h3>{{ 'sub_chapters' | translate }}</h3>
        <div class="sub-chapters">
            <ng-container *ngFor="let sC of subChapter.children">
              <button  mat-button color="primary" (click)="selectSubChapter(sC._id!)">
                {{ sC.nameForUI }}
              </button>
            </ng-container>

        </div>
      </ng-container>
<!--   end of if subChapters are   -->

    </ng-container>


    <ng-container *ngIf="{
      sizeA: (sizeOfScale$ | async),
      commonList: commonList$ | async,
      mediaTypeA: showMediaType$ | async,
      view: view$ | async
    } as state;">
<!--      <div #gallery [ngClass]="{ gallery: state.sizeA === 1, flex: state.sizeA === 2 }">-->
      <div class="switch-media">
        <button mat-button color="primary" (click)="showMedia('all')">фото і відео</button>
        <button mat-button color="primary" (click)="showMedia('photo')">вибрати фото</button>
        <button mat-button color="primary" (click)="showMedia('video')">вибрати відео</button>
      </div>
      <div #gallery [ngClass]="{ 'gallery': state.view === 'big', 'little': state.view === 'little', 'table': state.view === 'table' }">
        <ng-container *ngIf="(state.commonList && !!state.commonList?.length); else empty">
          <ng-container *ngFor="let item of state.commonList">

            <ng-container [ngSwitch]="state.view">
              <ng-container *ngSwitchCase="'big'">
                <ng-container *ngIf="item.type === 'photo' && (state.mediaTypeA === 'photo' || state.mediaTypeA === 'all')">
                  <app-photo [appEnlarge]="state.sizeA"
                             [appSetHeight]="computeGridStyle$ | async"
                             typeOfMedia="img"
                             (click)="openFullSize($event, item!)"
                             (updatedPhoto)="onPhotoUpdate($event)"
                             (imageLoaded)="onImageLoaded()"
                             [imageSrc]="item"></app-photo>
                </ng-container>
                <ng-container *ngIf="(item.type === 'video') && (state.mediaTypeA === 'video' || state.mediaTypeA === 'all')">
                  <app-video [appEnlarge]="state.sizeA"
                             typeOfMedia="video"
                             [appSetHeight]="computeGridStyle$ | async"
                             (videoLoaded)="onVideoLoaded($event)"
                             (updatedVideo)="onVideoUpdate($event)"
                             [videoSrc]="item"></app-video>
                </ng-container>
              </ng-container>

              <ng-container *ngSwitchCase="'table'">
                <ng-container *ngIf="item.type === 'photo' && (state.mediaTypeA === 'photo' || state.mediaTypeA === 'all')">
                  <div class="media-column">
                    <img (click)="openFullSize($event, item!)" (load)="onImageLoaded()" [src]="getAsset(item)" alt="">
                  </div>
                  <div class="desc-column" [matTooltip]="item.description" matTooltipPosition="left" >
                    {{ item.description || '' }}
                  </div>
                  <div class="date-column">
                    {{ (item.date | date) || ''}}
                  </div>
                </ng-container>
                <ng-container *ngIf="(item.type === 'video') && (state.mediaTypeA === 'video' || state.mediaTypeA === 'all')">
                  <div class="media-column">
                    <video controls>
                      <source [src]="getAsset(item)" type="video/mp4" >
                    </video>
                  </div>
                  <div class="desc-column" [matTooltip]="item.description" matTooltipPosition="left">
                    {{ item.description || '' }}
                  </div>
                  <div class="date-column">
                    {{ (item.date | date) || ''}}
                  </div>
                </ng-container>
              </ng-container>
            </ng-container>
          </ng-container>

        </ng-container>

      </div>

      <ng-container *ngIf="state.commonList && !!state.commonList?.length">
        <div class="change-size">
          <app-range-size [formControl]="size"></app-range-size>
        </div>
      </ng-container>


    </ng-container>

  </div>

</div>


<ng-template #empty>
  <div class="empty">{{ 'no_media_yet' | translate }} :)</div>
</ng-template>
