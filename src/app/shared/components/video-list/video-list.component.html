
<ng-container *ngIf="subChapter$ | async as subChapter">
  <h2>{{ subChapter.nameForUI }}</h2>
  <h3>{{ subLevels }}</h3>
  <div class="sub-chapters">
    <ng-container *ngIf="subChapter.children">
      <ng-container *ngFor="let sC of subChapter.children">
      <span class="sub-chapter" (click)="selectSubChapter(sC._id!)">
        {{ sC.nameForUI }}
      </span>
      </ng-container>
    </ng-container>

  </div>
</ng-container>


<div #gallery class="gallery">
  <ng-container *ngIf="videos$ | async as videos">
    <ng-container *ngFor="let video of videos">
      <!--      appEnlarge  to app-photo -->

      <app-video-element #appPhoto
                 [appSetHeight]="computeGridStyle$ | async"
                 [videoSrc]="video"></app-video-element>
    </ng-container>
  </ng-container>
</div>
